<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registro Ciudadano Región 4</title>

<link rel="stylesheet"
      href="css/estilosss.css">

</head>


<body>


<div class="formulario">


<h1>

Registro Ciudadano

</h1>


<!-- ================================= -->
<!-- NOMBRE Y EDAD -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Nombre completo
</label>

<input
id="nombre"
type="text">

</div>



<div class="campo">

<label>
Edad
</label>

<input
id="edad"
type="number">

</div>


</div>


<!-- ================================= -->
<!-- SEXO Y TELÉFONO -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Sexo
</label>

<select id="sexo">

<option value="">
Seleccione
</option>

<option>
Masculino
</option>

<option>
Femenino
</option>

<option>
Otro
</option>

</select>

</div>



<div class="campo">

<label>
Teléfono
</label>

<input
id="telefono"
type="tel">

</div>


</div>


<!-- ================================= -->
<!-- SECCIÓN Y COMUNIDAD -->
<!-- ================================= -->

<div class="campo">

<label>
Sección
</label>

<option>

</option>

<option>

<option>

<option>

</option>

<option>
5080
</option>

</select>

</div>



<div class="campo">

<label>
Comunidad
</label>

<select id="comunidad">

<option value="">
Seleccione comunidad
</option>

</select>

</div>


</div>


<!-- ================================= -->
<!-- CALLE Y NÚMERO -->
<!-- ================================= -->

<div class="fila">


<div class="campo">

<label>
Calle
</label>

<input
id="calle"
type="text">

</div>



<div class="campo">

<label>
Número
</label>

<input
id="numero"
type="text">

</div>


</div>


<!-- ================================= -->
<!-- IDENTIFICACIÓN INE -->
<!-- ================================= -->

<hr>


<h2>

<i class="fa-solid fa-user-plus"></i>

Identificación INE

</h2>


<!-- ================================= -->
<!-- INE FRENTE -->
<!-- ================================= -->

<div class="foto">


<label>
INE frente
</label>


<img
id="vistaFrente"
alt="Vista previa INE frente">


<input
type="file"
accept="image/*"
capture="environment"
id="ineFrente">

</div>


<!-- ================================= -->
<!-- INE ATRÁS -->
<!-- ================================= -->

<div class="foto">


<label>
INE atrás
</label>


<img
id="vistaAtras"
alt="Vista previa INE atrás">


<input
type="file"
accept="image/*"
capture="environment"
id="ineAtras">

</div>


<!-- ================================= -->
<!-- BOTÓN -->
<!-- ================================= -->

<button
type="button"
class="boton"
onclick="siguiente()">

Siguiente

</button>


</div>


<script src="js/registro.js?v=3"></script>


</body>

</html>

</html>
