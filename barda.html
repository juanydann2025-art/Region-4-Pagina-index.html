<div class="fila">

    <div class="campo">

        <label>
        Alto en mts
        </label>

        <input
        type="number"
        id="alto"
        step="0.01"
        min="0"
        placeholder="Ej. 2.50">

    </div>


    <div class="campo">

        <label>
        Ancho en mts
        </label>

        <input
        type="number"
        id="ancho"
        step="0.01"
        min="0"
        placeholder="Ej. 5.00">

    </div>

</div>


<div class="fila">

    <div class="campo">

        <label>
        Quién autoriza
        </label>

        <input
        type="text"
        id="autoriza"
        placeholder="Nombre de quien autoriza">

    </div>

</div>
