<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro Ciudadano Región 4</title>

<link rel="stylesheet" href="css/estilosss.css">

</head>


<body>


<div class="formulario">


<h1>

Registro Ciudadano
</h1>


<div class="grid">


<div>
<label>Nombre completo</label>
<input id="nombre" type="text">
</div>


<div>
<label>Edad</label>
<input id="edad" type="number">
</div>



<div>
<label>Sexo</label>

<select id="sexo">

<option value="">Seleccione</option>

<option>Masculino</option>

<option>Femenino</option>

<option>Otro</option>

</select>

</div>



<div>
<label>Teléfono</label>

<input id="telefono" type="tel">

</div>



<div>
<label>Sección</label>

<select id="seccion">

<option>Seleccione sección</option>

<option>4953</option>

<option>4954</option>
<option>4955</option>

<option>4962</option>

<option>5025</option>

<option>5026</option>

<option>5027</option>
<option>5034</option>
<option>5035</option>
<option>5036</option>
<option>5049</option>
<option>5050</option>
<option>5066</option>
<option>5067</option>
<option>5068</option>
<option>5069</option>
<option>5070</option>
<option>5071</option>
<option>5072</option>
<option>5073</option>
<option>5074</option>
<option>5075</option>
<option>5076</option>
<option>5077</option>
<option>5078</option>
<option>5079</option>
<option>5080</option>

</select>

</div>



<div>
<label>Comunidad</label>

<select id="comunidad">

<option value="">Seleccione comunidad</option>

</select>
</div>


<div>

<label>Calle</label>

<input id="calle">

</div>



<div>

<label>Número</label>

<input id="numero">

</div>



</div>



<hr>

<h2><i class="fa-solid fa-user-plus">Identificación INE</i></h2>






<div class="foto">

<label>INE frente</label>

<img
  id="vistaFrente"
  alt="Vista previa INE frente">

<input 
  type="file"
  accept="image/*"
  capture="environment"
  id="ineFrente">

</div>


<div class="foto">

<label>INE atrás</label>

<img
  id="vistaAtras"
  alt="Vista previa INE atrás">

<input 
  type="file"
  accept="image/*"
  capture="environment"
  id="ineAtras">

</div>

<button 
class="boton"
onclick="siguiente()">

Siguiente

</button>


</div>



<script src="js/registro.js?v=3"></script>


</body>

</html>
